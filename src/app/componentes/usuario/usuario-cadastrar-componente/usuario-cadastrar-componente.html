<section class="login-card" aria-labelledby="login-title">
  <header class="login-header">
    <h1 id="login-title">Cadastrar Usuário</h1>
    <p>Crie uma Conta</p>
  </header>

  <form class="login-form" action="/login" method="post">
    <div class="form-group">
      <label for="email">Usuário</label>
      <input id="usuario" name="usuario" type="text" placeholder="Nome de usuário"/>
    </div>

    <div class="form-group">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" placeholder="seu@email.com" autocomplete="email" required/>
    </div>

    <div class="form-group">
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" placeholder="Digite sua senha" autocomplete="current-password"
        required />
    </div>

    <div class="form-group">
      <label for="senha">Confirmar Senha</label>
      <input id="conf-senha" name="conf-senha" type="password" placeholder="Confirme sua senha" autocomplete="current-password"
        required />
    </div>

    <button type="submit" class="btn-submit">Cadastrar</button>
  </form>

  <footer class="login-footer">
    <p>Já possui uma conta? <a routerLink='/usuario/login'>Faça Login</a></p>
  </footer>
</section>
